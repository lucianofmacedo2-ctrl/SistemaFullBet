name: Sincronização Diária de Jogos (Football-Data)

on:
  # Agendamento automático todo dia de manhã (06:00 UTC = 03:00 Horário de Brasília / 09:00 UTC = 06:00 Horário de Brasília)
  schedule:
    - cron: '0 9 * * *'
  
  # Permite disparar manualmente a qualquer momento pela aba "Actions" no GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Executar Script de Sincronização
        env:
          APP_API_URL: ${{ secrets.APP_API_URL }}
        run: |
          python scripts/sync_football_data.py

      - name: Commit e Push das Atualizações no GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync: Atualização diária dos jogos [skip ci]" && git push)
